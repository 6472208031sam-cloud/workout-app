<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="1.5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Workout</title>
<style>
  :root{
    --bg:#0b0d12; --bg2:#10131a; --card:#171a22; --card2:#1f232e; --line:#262b37; --line2:#313847;
    --txt:#f2f4f9; --dim:#9aa3b5; --dim2:#6e7789;
    --acc:#7c5cff; --acc2:#a58dff; --accsoft:rgba(124,92,255,.16);
    --ok:#2fbf71; --oksoft:rgba(47,191,113,.14); --warn:#ffb020;
    --rad:20px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1b1f2e 0%, var(--bg) 55%) fixed, var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:96px; font-size:16px;
  }
  a{color:var(--acc2)}
  ::selection{background:var(--acc);color:#fff}

  header.top{
    position:sticky;top:0;z-index:5;
    background:rgba(11,13,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
    display:flex;align-items:center;gap:10px;
  }
  header.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
  .badge{font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:3px 9px;background:var(--card)}
  .streak{margin-left:auto;font-size:13px;color:var(--warn);font-weight:700;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);padding:5px 11px;border-radius:999px}
  .streak:empty{display:none}

  main{max-width:640px;margin:0 auto;padding:18px 16px}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--rad);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.3px}
  .card h3{margin:0 0 6px;font-size:16px;font-weight:700}
  .dim{color:var(--dim)} .small{font-size:13.5px} .tiny{font-size:12px}
  .focus{color:var(--dim);font-size:14.5px;margin:2px 0 12px;line-height:1.45}

  .pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--acc),#6246ea);border-radius:999px;padding:5px 11px;margin-bottom:10px;box-shadow:0 4px 14px rgba(124,92,255,.35)}
  .pill.grey{background:#333a49;box-shadow:none;color:#c6ccd9}
  .pill.green{background:linear-gradient(135deg,#35cf7d,#23a866);box-shadow:0 4px 14px rgba(47,191,113,.3)}

  .bar{height:9px;background:#242936;border-radius:99px;overflow:hidden;margin:10px 0 5px}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s ease}

  .ex{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;border-top:1px solid var(--line)}
  .ex:first-of-type{border-top:none}
  .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accsoft);color:var(--acc2);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;border:1px solid rgba(124,92,255,.35)}
  .ex input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);flex:none;margin-top:1px;cursor:pointer}
  .ex .nm{font-weight:650;font-size:15.5px;line-height:1.3}
  .ex .ds{color:var(--dim);font-size:13.5px;margin-top:2px;line-height:1.4}
  .ex .cue{color:var(--dim);font-size:13.5px;margin-top:5px;line-height:1.5}
  .exname a{color:var(--txt);text-decoration:none;border-bottom:2px solid var(--acc)}
  .play{font-size:10.5px;background:var(--acc);color:#fff;border-radius:999px;padding:2.5px 8px;margin-left:7px;vertical-align:2.5px;font-weight:800;letter-spacing:.4px;white-space:nowrap}

  button{font:inherit;border:none;border-radius:14px;padding:14px 18px;font-weight:750;cursor:pointer;transition:transform .05s ease, filter .15s ease}
  button:active{transform:scale(.985)}
  .btn{background:linear-gradient(135deg,var(--acc),#6246ea);color:#fff;width:100%;box-shadow:0 8px 20px rgba(124,92,255,.28);font-size:15.5px}
  .btn.secondary{background:var(--card2);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line2);box-shadow:none}
  .btn.okbtn{background:linear-gradient(135deg,#35cf7d,#23a866);color:#04150b;box-shadow:0 8px 20px rgba(47,191,113,.25)}
  .btn:disabled{opacity:.5;box-shadow:none}
  .row{display:flex;gap:10px} .row>*{flex:1}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(13,15,21,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;background:none;color:var(--dim2);border-radius:0;padding:13px 4px 15px;font-size:13px;font-weight:650}
  nav.tabs button.on{color:#fff;box-shadow:inset 0 2.5px 0 var(--acc)}

  .dayrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:center}
  .dayrow:first-of-type{border-top:none}

  details{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  summary{cursor:pointer;font-weight:700;font-size:15.5px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'▾';float:right;color:var(--dim2)}
  details[open ]>summary::after{content:'▴'}
  details .inner{padding-top:8px}
  details details{margin:8px 0;background:var(--bg2)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{border:1px solid var(--line2);background:var(--card2);color:var(--dim);border-radius:999px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:14px}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}

  .planpick{border:2px solid var(--line);border-radius:var(--rad);padding:20px;margin-bottom:14px;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:var(--shadow)}
  .planpick.active{border-color:var(--acc)}
  .planpick h3{margin:0 0 4px;font-size:17px}

  .note{background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(124,92,255,.07));border:1px solid rgba(124,92,255,.4);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#d9d2ff;margin-bottom:14px;line-height:1.5}

  /* ----- Guided player ----- */
  #player{position:fixed;inset:0;z-index:20;background:radial-gradient(900px 500px at 50% -10%, #1d2133 0%, var(--bg) 60%);display:none;flex-direction:column;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  #player.open{display:flex}
  #player .prow{display:flex;align-items:center;gap:10px;flex:none}
  #pStep{margin-bottom:0}
  #pExit{margin-left:auto;flex:none;padding:10px 16px;border-radius:999px}
  .stage{margin-top:22px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:26px 22px;box-shadow:var(--shadow)}
  #player .big{font-size:31px;font-weight:850;line-height:1.2;margin:6px 0 4px;letter-spacing:-.5px}
  #pDose{display:inline-block;margin-top:8px;background:var(--accsoft);border:1px solid rgba(124,92,255,.4);color:#d9d2ff;font-weight:700;font-size:14.5px;padding:7px 13px;border-radius:999px}
  #pDose:empty{display:none}
  #pCue{color:var(--dim);line-height:1.6;font-size:15px;margin-top:14px}
  #pCue:empty{display:none}
  #pVideo{margin-top:18px}
  #pVideo:empty{display:none}
  .videobtn{display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;color:#111;text-decoration:none;font-weight:800;border-radius:14px;padding:14px 18px;font-size:15.5px;box-shadow:0 8px 20px rgba(255,255,255,.12)}
  #timer{font-size:64px;font-weight:850;text-align:center;margin:20px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  #pTimerBtn{margin-top:10px}
  .segs{display:flex;gap:5px;margin:22px 2px 4px}
  .segs span{flex:1;height:6px;border-radius:99px;background:#2a2f3d}
  .segs span.done{background:var(--acc2)}
  .segs span.now{background:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
  .pactions{flex:none;margin-top:14px}
</style>
</head>
<body>
<header class="top"><h1>🏋️ Workout</h1><span class="badge">hosted v1.5</span><span class="streak" id="streak"></span></header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="today">Today</button>
  <button data-tab="week">Week</button>
  <button data-tab="program">Program</button>
  <button data-tab="plans">Plans</button>
</nav>

<div id="player">
  <div class="prow"><span class="pill" id="pStep"></span><button class="btn ghost" id="pExit">✕ Exit</button></div>
  <div class="stage">
    <div class="big" id="pName"></div>
    <div id="pDose"></div>
    <div id="pCue"></div>
    <div id="pVideo"></div>
    <div id="timer" style="display:none">0:00</div>
    <button class="btn secondary" id="pTimerBtn" style="display:none">▶ Start timer</button>
  </div>
  <div class="segs" id="pDots"></div>
  <div style="flex:1"></div>
  <div class="pactions">
    <div class="row">
      <button class="btn ghost" id="pPrev">← Prev</button>
      <button class="btn" id="pNext">Done · Next →</button>
    </div>
    <button class="btn okbtn" id="pFinish" style="display:none;margin-top:10px;width:100%">✓ Finish workout</button>
  </div>
</div>

<script>
const CORE = {"sessions":[{"approxMinutes":18,"exercises":[{"cue":"On your back, arms up, knees over hips. Press your lower back into the floor and keep it there as you slowly extend the opposite arm and leg.","dose":"3 sets × 10 reps (5 per side)","holdSeconds":null,"id":"dead-bug","name":"Dead Bug"},{"cue":"Elbows under shoulders, body in one straight line from head to heels. Squeeze your glutes and brace like you're about to be poked in the stomach.","dose":"3 sets × 40 sec hold","holdSeconds":40,"id":"forearm-plank","name":"Forearm Plank"},{"cue":"On all fours, reach one arm forward and the opposite leg back until both are level with your torso. Keep your hips perfectly still — imagine a glass of water on your lower back.","dose":"3 sets × 8 reps per side","holdSeconds":null,"id":"bird-dog","name":"Bird Dog"},{"cue":"Feet flat, drive through your heels and lift your hips until knees, hips, and shoulders line up. Pause and squeeze at the top for a full second.","dose":"3 sets × 15 reps","holdSeconds":null,"id":"glute-bridge","name":"Glute Bridge"},{"cue":"Knees bent at 90°, curl your hips off the floor toward your ribs. Lower slowly — the way down is half the work.","dose":"3 sets × 12 reps","holdSeconds":null,"id":"reverse-crunch","name":"Reverse Crunch"},{"cue":"Elbow under shoulder, feet stacked, hips lifted into one straight line. Don't let your hips roll forward or sag.","dose":"2 sets × 30 sec per side","holdSeconds":30,"id":"side-plank","name":"Side Plank"}],"focus":"Deep abs, control, and a strong brace — the base everything else builds on.","key":"core-foundation","title":"Core Foundation","track":"core"},{"approxMinutes":18,"exercises":[{"cue":"Lower back pressed down, shoulders and legs lifted, body in a shallow banana shape. Bend your knees to make it easier, straighten to make it harder.","dose":"3 sets × 20 sec hold","holdSeconds":20,"id":"hollow-hold","name":"Hollow Body Hold"},{"cue":"Hands under your hips, legs straight. Raise to vertical and lower slowly without letting your heels touch down or your back arch.","dose":"3 sets × 10 reps","holdSeconds":null,"id":"leg-raises","name":"Lying Leg Raises"},{"cue":"Sit tall, lean back slightly, lift your feet if you can. Rotate your whole ribcage side to side — not just your arms.","dose":"3 sets × 16 twists (8 per side)","holdSeconds":null,"id":"russian-twist","name":"Russian Twist"},{"cue":"From a high plank, drive knees toward your chest one at a time. Keep hips level and low — speed comes second, position first.","dose":"3 sets × 30 sec","holdSeconds":30,"id":"mountain-climbers","name":"Mountain Climbers"},{"cue":"Same rules as always: lower back glued to the floor, slow extensions, exhale as you reach.","dose":"2 sets × 10 reps (5 per side)","holdSeconds":null,"id":"dead-bug-2","name":"Dead Bug"},{"cue":"Straight line, hips high. If it feels easy, lift the top leg for the last 10 seconds.","dose":"2 sets × 30 sec per side","holdSeconds":30,"id":"side-plank-2","name":"Side Plank"}],"focus":"Lower abs, obliques, and rotational strength.","key":"core-deep","title":"Deep Core & Obliques","track":"core"},{"approxMinutes":15,"exercises":[{"cue":"Grip a sturdy bar overhead, feet off the ground, and let your body hang long and heavy. Relax your shoulders down away from your ears and breathe slowly — this gently decompresses your spine.","dose":"3 sets × 30 sec hang","holdSeconds":30,"id":"dead-hang","name":"Dead Hang"},{"cue":"On all fours, slowly round your back toward the ceiling, then let it sink into a gentle arch. Move with your breath, one vertebra at a time.","dose":"2 sets × 10 slow reps","holdSeconds":null,"id":"cat-cow","name":"Cat-Cow"},{"cue":"Face down, hands under shoulders, press up to a comfortable arch with hips on the floor. Keep your shoulders down and glutes relaxed.","dose":"3 sets × 30 sec hold","holdSeconds":30,"id":"cobra","name":"Cobra Stretch"},{"cue":"Back, head, and arms flat against a wall. Slide your arms up and down like a snow angel, keeping every contact point on the wall.","dose":"3 sets × 10 reps","holdSeconds":null,"id":"wall-angels","name":"Wall Angels"},{"cue":"Sit or stand tall. Glide your chin straight back to make a double chin, hold two seconds, release. Small move, big effect on forward-head posture.","dose":"3 sets × 10 reps","holdSeconds":null,"id":"chin-tucks","name":"Chin Tucks"},{"cue":"Face down, lift arms, chest, and thighs off the floor and reach long through your fingers and toes. Builds the back muscles that hold you upright.","dose":"3 sets × 20 sec hold","holdSeconds":20,"id":"superman","name":"Superman Hold"}],"focus":"Decompression, back strength, and undoing the slouch — so you stand at your full height.","key":"posture-stand-tall","title":"Stand Tall","track":"posture"},{"approxMinutes":15,"exercises":[{"cue":"Full relaxed hang from a sturdy bar. Let gravity do the work — long spine, slow breaths.","dose":"3 sets × 30 sec hang","holdSeconds":30,"id":"dead-hang-2","name":"Dead Hang"},{"cue":"Lie on your side, knees bent and stacked. Open your top arm across your body like opening a book, following your hand with your eyes, keeping your knees down.","dose":"2 sets × 8 reps per side","holdSeconds":null,"id":"book-openers","name":"Thoracic Book Openers"},{"cue":"Half-kneeling, tuck your tailbone under and shift gently forward until you feel the front of your back hip stretch. Tight hip flexors pull you into a slouch — this undoes it.","dose":"2 sets × 30 sec per side","holdSeconds":30,"id":"hip-flexor-stretch","name":"Hip Flexor Stretch"},{"cue":"Forearm on a door frame, elbow at shoulder height, step through gently until your chest opens. Opening the chest lets your shoulders sit back where they belong.","dose":"2 sets × 30 sec per side","holdSeconds":30,"id":"doorway-stretch","name":"Doorway Chest Stretch"},{"cue":"Stand with heels, glutes, shoulder blades, and the back of your head all touching a wall. This is your full-height position — hold it and memorize the feeling.","dose":"2 sets × 45 sec hold","holdSeconds":45,"id":"wall-posture-hold","name":"Wall Posture Hold"},{"cue":"Press up gently, hips down, shoulders away from your ears. Finish tall.","dose":"2 sets × 30 sec hold","holdSeconds":30,"id":"cobra-2","name":"Cobra Stretch"}],"focus":"Opening the chest and hips and lengthening the spine after long days of sitting.","key":"posture-open","title":"Open & Lengthen","track":"posture"}]};

const LS_KEY = 'workoutHostedV1';

function isoLocal(d){ const x=new Date(d.getTime()-d.getTimezoneOffset()*60000); return x.toISOString().slice(0,10); }
function todayISO(){ return isoLocal(new Date()); }
function parseISO(s){ const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoLocal(d); }
function dowMon(s){ return (parseISO(s).getDay()+6)%7; } // 0=Mon
const DAYNAMES=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

let S;
try{ S = JSON.parse(localStorage.getItem(LS_KEY)) || null; }catch(e){ S=null; }
if(!S || typeof S!=='object'){
  S = { plan:'core', coreDays:[0,2,4], coreStart: todayISO(), checks:{}, done:{}, btrZero:true, btrDone:{}, tab:'today' };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Core & Posture ---------- */
const CORE_ORDER = ['core-foundation','posture-stand-tall','core-deep','posture-open'];
function coreSession(key){ return CORE.sessions.find(x=>x.key===key); }
function isTrainingDay(iso){ return S.coreDays.includes(dowMon(iso)); }
function coreSessionFor(iso){
  if(iso < S.coreStart) return null;
  let n=0; let d=S.coreStart;
  while(d<iso){ if(isTrainingDay(d)) n++; d=addDays(d,1); }
  if(!isTrainingDay(iso)) return null;
  return coreSession(CORE_ORDER[n%4]);
}
function nextTrainingDay(iso){ let d=addDays(iso,1); while(!isTrainingDay(d)) d=addDays(d,1); return d; }

/* ---------- Beyond the Rim ---------- */
function btrSeq(){
  const out=[];
  for(const ph of BTR.phases){
    if(ph.phase===0 && !S.btrZero) continue;
    for(const wk of ph.weeks) for(const dy of wk.days)
      out.push({ key:'p'+ph.phase+'w'+wk.week+'d'+dy.day, phase:ph.phase, phaseLabel:ph.label, week:wk.week, day:dy.day, title:dy.title, exercises:dy.exercises });
  }
  return out;
}
function btrCurrent(){ const seq=btrSeq(); return seq.find(d=>!S.btrDone[d.key]) || null; }
function btrDoneCount(){ const seq=btrSeq(); return seq.filter(d=>S.btrDone[d.key]).length; }
function prettyDay(d){ return d.phaseLabel+' · Week '+d.week+' · Day '+d.day; }

/* ---------- shared ---------- */
function streak(){
  let n=0; let d=todayISO();
  if(!S.done[d]) d=addDays(d,-1);
  while(S.done[d]){ n++; d=addDays(d,-1); }
  return n;
}
function checkKey(iso,sessKey){ return iso+'|'+sessKey; }
function getChecks(iso,sessKey){ return S.checks[checkKey(iso,sessKey)]||[]; }
function setCheck(iso,sessKey,idx,on){
  const k=checkKey(iso,sessKey); let arr=getChecks(iso,sessKey).slice();
  if(on && !arr.includes(idx)) arr.push(idx);
  if(!on) arr=arr.filter(i=>i!==idx);
  S.checks[k]=arr; save();
}
function exName(e){
  if(e.videoUrl) return '<span class="exname"><a href="'+e.videoUrl+'" target="_blank" rel="noopener">'+esc(e.name)+'</a></span><span class="play">▶ VIDEO</span>';
  return esc(e.name);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---------- Player ---------- */
let P=null; let timerInt=null, timerLeft=0;
function holdSecs(e){
  if(e.holdSeconds) return e.holdSeconds;
  const m=/(\d+)\s*(sec|second)/i.exec(e.dose||''); return m?parseInt(m[1]):null;
}
function openPlayer(sessKey, title, exercises, onFinish){
  P={ sessKey, title, exercises, i:0, onFinish };
  document.getElementById('player').classList.add('open'); renderPlayer();
}
function closePlayer(){ stopTimer(); P=null; document.getElementById('player').classList.remove('open'); }
function stopTimer(){ if(timerInt){ clearInterval(timerInt); timerInt=null; } const b=document.getElementById('pTimerBtn'); if(b) b.textContent='▶ Start timer'; }
function renderPlayer(){
  if(!P) return;
  const e=P.exercises[P.i];
  document.getElementById('pStep').textContent = P.title+' · '+(P.i+1)+' of '+P.exercises.length;
  document.getElementById('pName').innerHTML = exName(e);
  document.getElementById('pDose').textContent = e.dose||'';
  document.getElementById('pCue').textContent = e.cue||'';
  document.getElementById('pVideo').innerHTML = e.videoUrl ? '<a class="videobtn" href="'+e.videoUrl+'" target="_blank" rel="noopener">▶ Watch demo video</a>' : '';
  const hs=holdSecs(e); const t=document.getElementById('timer'), tb=document.getElementById('pTimerBtn');
  stopTimer();
  if(hs){ t.style.display='block'; tb.style.display='block'; timerLeft=hs; t.textContent=fmtT(hs); }
  else { t.style.display='none'; tb.style.display='none'; }
  document.getElementById('pDots').innerHTML = P.exercises.map((_,j)=>'<span class="'+(j<P.i?'done':(j===P.i?'now':''))+'"></span>').join('');
  document.getElementById('pPrev').disabled = P.i===0;
  const last = P.i===P.exercises.length-1;
  document.getElementById('pNext').style.display = last?'none':'block';
  document.getElementById('pFinish').style.display = last?'block':'none';
}
function fmtT(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
document.getElementById('pExit').onclick=()=>{ closePlayer(); render(); };
document.getElementById('pPrev').onclick=()=>{ if(P&&P.i>0){ P.i--; renderPlayer(); } };
document.getElementById('pNext').onclick=()=>{ if(!P) return; setCheck(todayISO(), P.sessKey, P.i, true); if(P.i<P.exercises.length-1){ P.i++; renderPlayer(); } };
document.getElementById('pFinish').onclick=()=>{ if(!P) return; setCheck(todayISO(), P.sessKey, P.i, true); const f=P.onFinish; closePlayer(); if(f) f(); render(); };
document.getElementById('pTimerBtn').onclick=function(){
  const t=document.getElementById('timer');
  if(timerInt){ stopTimer(); return; }
  let left=timerLeft;
  this.textContent='⏸ Pause';
  timerInt=setInterval(()=>{ left--; t.textContent=fmtT(Math.max(left,0)); if(left<=0){ stopTimer(); t.textContent='✓ Done'; if(navigator.vibrate) navigator.vibrate(200); } },1000);
};

function exerciseList(iso, sessKey, exercises, showCues){
  return exercises.map((e,i)=>{
    const on=getChecks(iso,sessKey).includes(i);
    return '<div class="ex"><input type="checkbox" data-ck="'+i+'" '+(on?'checked':'')+'><div><div class="nm">'+exName(e)+'</div><div class="ds">'+esc(e.dose||'')+'</div>'+(showCues&&e.cue?'<div class="cue">'+esc(e.cue)+'</div>':'')+'</div></div>';
  }).join('');
}
function bindChecks(iso, sessKey){
  view.querySelectorAll('[data-ck]').forEach(cb=> cb.onchange=()=>{ setCheck(iso, sessKey, parseInt(cb.dataset.ck), cb.checked); });
}

function btrDayByKey(key){
  for(const ph of BTR.phases) for(const wk of ph.weeks) for(const dy of wk.days)
    if('p'+ph.phase+'w'+wk.week+'d'+dy.day===key)
      return { key, phase:ph.phase, phaseLabel:ph.label, week:wk.week, day:dy.day, title:dy.title, exercises:dy.exercises };
  return null;
}

function durSecs(seg){
  const m=/(\d+)(?:\s*-\s*(\d+))?\s*(minutes?|min|seconds?|sec)\b/i.exec(seg);
  if(!m) return null;
  const v=m[2]? (parseFloat(m[1])+parseFloat(m[2]))/2 : parseFloat(m[1]);
  return m[3].toLowerCase().indexOf('min')===0 ? v*60 : v;
}
function exSecs(name, dose){
  if(!dose) return 180;
  const low=(name+' '+dose).toLowerCase();
  const segs=dose.split('·').map(s=>s.trim());
  const setsM=/(\d+)\s*sets?\b/i.exec(dose); const sets=setsM? parseInt(setsM[1]) : 1;
  const repsM=/(\d+)\s*reps?\b/i.exec(dose); const reps=repsM? parseInt(repsM[1]) : null;
  const perSide=/each (leg|side)|per side/i.test(dose)? 2:1;
  const main=segs[0]||dose; const md=durSecs(main);
  let work=0, rest=0;
  if(low.indexOf('pyramid')>=0) work=55*2.5;
  else if(md!==null && /(minute|second)/i.test(main)) work=(setsM && /sets?\s+of/i.test(main))? sets*md : md;
  else if(reps!==null) work= main.toLowerCase().indexOf('yards')>=0 ? sets*reps*0.8 : sets*reps*3*perSide;
  else if(main.toLowerCase().indexOf('round')>=0){
    if(low.indexOf('core workout')>=0) work=600;
    else if(low.indexOf('stretching')>=0 || low.indexOf('mobility')>=0) work=360;
    else if(low.indexOf('breathing')>=0) work=180;
    else work=300;
  }
  else work=120;
  for(let k=1;k<segs.length;k++){
    const seg=segs[k];
    if(!/rest/i.test(seg)) continue;
    const rd=durSecs(seg); if(rd===null) continue;
    if(seg.toLowerCase().indexOf('between jumps')>=0 && reps!==null) rest+=rd*(reps-1)*sets;
    else if(seg.toLowerCase().indexOf('between')>=0) rest+=rd*Math.max(sets-1,1);
    else rest+=rd;
  }
  return work+rest+20;
}
function dayMinutes(day){ return Math.round(day.exercises.reduce((a,e)=>a+exSecs(e.name, e.dose||''),0)/60); }
function fmtMins(m){ if(m<60) return '~'+m+' min'; const h=Math.floor(m/60), r=m%60; return '~'+h+' h'+(r? ' '+r+' min' : ''); }

      const nd=nextTrainingDay(iso);
      h+='<div class="card"><span class="pill grey">Rest day</span><h2>No workout scheduled today</h2><p class="focus">Next training day: '+DAYNAMES[dowMon(nd)]+' '+nd+'</p></div>';
    } else {
      const doneToday = S.done[iso]==='core';
      h+='<div class="card"><span class="pill">'+(sess.track==='core'?'Core & Abs':'Posture & Height')+'</span><h2>'+esc(sess.title)+'</h2><p class="focus">'+esc(sess.focus)+' (~'+sess.approxMinutes+' min)</p>'
        + exerciseList(iso, sess.key, sess.exercises, true)
        + '<div style="height:10px"></div>'
        + '<button class="btn" id="startBtn">▶ Start workout (guided)</button><div style="height:8px"></div>'
        + (doneToday? '<button class="btn okbtn" disabled>✓ Completed today</button>' : '<button class="btn okbtn" id="completeBtn">✓ Mark complete</button>')
        + resetCard(iso)
        + '</div>';
    }
    view.innerHTML=h;
    const sess2=coreSessionFor(iso);
    if(sess2){
      bindChecks(iso, sess2.key);
      document.getElementById('startBtn').onclick=()=> openPlayer(sess2.key, sess2.title, sess2.exercises, ()=>completeCore());
      const cb=document.getElementById('completeBtn'); if(cb) cb.onclick=()=>{ completeCore(); render(); };
      bindReset(iso);
    }
    return;
  }
  // Beyond the Rim
  const seq=btrSeq(); const dn=btrDoneCount(); const nxt=btrCurrent();
  const doneTodayKey=Object.keys(S.btrDone).find(k=>S.btrDone[k]===iso);
  let cur=nxt, showingDone=false;
  if(doneTodayKey && S.btrSkipAhead!==iso){
    const dd=btrDayByKey(doneTodayKey);
    if(dd && (!nxt || dd.key!==nxt.key)){ cur=dd; showingDone=true; }
  }
  h+='<div class="note">Beyond the Rim · progress saves on this device only. Days are done in order — extra rest days are fine, you pick up where you left off.</div>';
  if(!cur){
    h+='<div class="card"><span class="pill green">Program complete 🎉</span><h2>You finished Beyond the Rim!</h2><p class="focus">All '+seq.length+' days done. You can restart from the Plans tab.</p></div>';
    view.innerHTML=h;
    return;
  }
  const sessKey='btr-'+cur.key;
  const posIdx = seq.findIndex(d=>d.key===cur.key)>=0 ? seq.findIndex(d=>d.key===cur.key)+1 : dn;
  h+='<div class="card">'
    + (showingDone? '<span class="pill green">✓ Completed today</span>' : '<span class="pill">Beyond the Rim</span>')
    + '<h2>'+esc(cur.title)+'</h2><p class="focus">'+prettyDay(cur)+' · Day '+posIdx+' of '+seq.length+' · '+fmtMins(dayMinutes(cur))+'</p>'
    + '<div class="bar"><div style="width:'+Math.round(dn/seq.length*100)+'%"></div></div><div class="tiny dim">'+dn+' of '+seq.length+' days complete</div>'
    + (showingDone? '<p class="small" style="color:var(--ok);font-weight:700;margin-top:8px">✓ You finished this day today — every exercise below is checked off. '+(nxt? 'Next up: '+prettyDay(nxt)+'.' : '')+'</p>' : '')
    + '<p class="small dim" style="margin-top:8px">Tap an exercise name marked ▶ VIDEO to watch its demonstration video from the book.</p>'
    + exerciseList(iso, sessKey, cur.exercises, false)
    + '<div style="height:10px"></div>';
  if(showingDone){
    if(nxt) h+='<button class="btn" id="nextDayBtn">Start next day now →</button><div style="height:8px"></div>';
    h+='<button class="btn okbtn" disabled>✓ Completed today</button>';
  } else {
    h+='<button class="btn" id="startBtn">▶ Start workout (guided)</button><div style="height:8px"></div>'
      + '<button class="btn okbtn" id="completeBtn">✓ Mark day complete</button>';
  }
  h+= resetCard(iso) + '</div>';
  view.innerHTML=h;
  bindChecks(iso, sessKey);
  const sb=document.getElementById('startBtn'); if(sb) sb.onclick=()=> openPlayer(sessKey, cur.title, cur.exercises, ()=>completeBtr());
  const cb=document.getElementById('completeBtn'); if(cb) cb.onclick=()=>{ completeBtr(); render(); };
  const nb=document.getElementById('nextDayBtn'); if(nb) nb.onclick=()=>{ S.btrSkipAhead=iso; save(); render(); };
  bindReset(iso);
}

function resetCard(iso){
  const has = Object.keys(S.checks).some(k=>k.startsWith(iso+'|') && (S.checks[k]||[]).length) || S.done[iso];
  if(!has) return '';
  return '<div style="height:8px"></div><button class="btn ghost" id="resetBtn">↺ Reset day — start over</button>';
}
function bindReset(iso){
  const b=document.getElementById('resetBtn'); if(!b) return;
  b.onclick=()=>{
    if(b.dataset.arm){ doResetDay(iso); render(); }
    else { b.dataset.arm='1'; b.textContent='Tap again to confirm reset'; }
  };
}
function doResetDay(iso){
  Object.keys(S.checks).forEach(k=>{ if(k.startsWith(iso+'|')) delete S.checks[k]; });
  if(S.done[iso]==='btr'){ const cur=Object.keys(S.btrDone).find(k=>S.btrDone[k]===iso); if(cur) delete S.btrDone[cur]; }
  if(S.btrSkipAhead===iso) delete S.btrSkipAhead;
  delete S.done[iso]; save();
}
function completeCore(){
  const iso=todayISO(); const sess=coreSessionFor(iso); if(!sess) return;
  S.checks[checkKey(iso,sess.key)] = sess.exercises.map((_,i)=>i);
  S.done[iso]='core'; save();
}
function completeBtr(){
  const iso=todayISO(); const cur=btrCurrent(); if(!cur) return;
  S.checks[checkKey(iso,'btr-'+cur.key)] = cur.exercises.map((_,i)=>i);
  S.btrDone[cur.key]=iso; S.done[iso]='btr'; save();
}

function renderWeek(){
  let h='<h2 style="margin:4px 0 12px">Your week</h2>';
  if(S.plan==='core'){
    const iso=todayISO(); const mon=addDays(iso, -dowMon(iso));
    h+='<div class="card">';
    for(let i=0;i<7;i++){
      const d=addDays(mon,i); const sess=coreSessionFor(d);
      h+='<div class="dayrow"><span><strong>'+DAYNAMES[i]+'</strong> <span class="dim">'+d.slice(5)+'</span>'+(d===iso?' · today':'')+'</span><span>'+(sess? esc(sess.title)+' <span class="dim">· ~'+sess.approxMinutes+' min</span>' : '<span class="dim">Rest</span>')+(S.done[d]==='core'?' ✓':'')+'</span></div>';
    }
    h+='</div>';
  } else {
    const seq=btrSeq(); const cur=btrCurrent();
    const curIdx = cur? seq.findIndex(d=>d.key===cur.key) : seq.length;
    const wkStart = Math.floor(curIdx/7)*7;
    h+='<div class="card"><h3>'+(cur? prettyDay(cur).split('·')[0].trim()+' · Week '+cur.week : 'Program complete')+'</h3>';
    for(let i=wkStart;i<Math.min(wkStart+7, seq.length);i++){
      const d=seq[i]; const st = S.btrDone[d.key] ? '✓ done' : (d===cur? '▶ today' : 'upcoming');
      h+='<div class="dayrow"><span><strong>Day '+d.day+'</strong> · '+esc(d.title)+'</span><span class="dim">'+fmtMins(dayMinutes(d))+' · '+st+'</span></div>';
    }
    h+='</div>';
  }
  const hist=Object.keys(S.done).sort().reverse().slice(0,14);
  h+='<div class="card"><h3>Recent completions</h3>'+(hist.length? hist.map(d=>'<div class="dayrow"><span>'+d+'</span><span>'+(S.done[d]==='btr'?'Beyond the Rim':'Core & Posture')+' ✓</span></div>').join('') : '<p class="dim small">Nothing yet — your finished days will show here.</p>')+'</div>';
  view.innerHTML=h;
}

function renderProgram(){
  let h='<h2 style="margin:4px 0 12px">Program</h2>';
  if(S.plan==='core'){
    for(const sess of CORE.sessions){
      h+='<details'+(CORE_ORDER.indexOf(sess.key)===0?' open':'')+'><summary>'+esc(sess.title)+' <span class="dim small">· '+(sess.track==='core'?'Core & Abs':'Posture & Height')+' · ~'+sess.approxMinutes+' min</span></summary><div class="inner"><p class="focus">'+esc(sess.focus)+'</p>'
        + sess.exercises.map((e,i)=>'<div class="ex"><span class="num">'+(i+1)+'</span><div><div class="nm">'+esc(e.name)+'</div><div class="ds">'+esc(e.dose)+'</div><div class="cue">'+esc(e.cue)+'</div></div></div>').join('')+'</div></details>';
    }
    h+='<p class="tiny dim">Posture work supports standing at your full height — no workout can guarantee growing taller.</p>';
  } else {
    for(const ph of BTR.phases){
      if(ph.phase===0 && !S.btrZero) continue;
      h+='<h3 style="margin:14px 0 8px">'+esc(ph.label)+(ph.phase===0?' <span class="dim small">(knee-pain prep — only if you have knee pain)</span>':'')+'</h3>';
      for(const wk of ph.weeks){
        h+='<details><summary>Week '+wk.week+'</summary><div class="inner">';
        for(const dy of wk.days){
          const key='p'+ph.phase+'w'+wk.week+'d'+dy.day;
          h+='<details><summary>Day '+dy.day+' — '+esc(dy.title)+' <span class="dim small">· '+fmtMins(dayMinutes(dy))+'</span>'+(S.btrDone[key]?' ✓':'')+'</summary><div class="inner">'
            + dy.exercises.map((e,i)=>'<div class="ex"><span class="num">'+(i+1)+'</span><div><div class="nm">'+exName(e)+'</div><div class="ds">'+esc(e.dose||'')+'</div></div></div>').join('')+'</div></details>';
        }
        h+='</div></details>';
      }
    }
    h+='<p class="tiny dim">Beyond the Rim — Bodyweight Edition by Nathanael Morton. Demonstration videos open on YouTube.</p>';
  }
  view.innerHTML=h;
}

function renderPlans(){
  let h='<h2 style="margin:4px 0 12px">Choose your plan</h2>';
  h+='<div class="planpick'+(S.plan==='core'?' active':'')+'"><span class="pill">Core & Posture</span><h3>Core, abs &amp; posture</h3><p class="focus">Two alternating tracks — Core &amp; Abs and Posture &amp; Height — on your training days. Supports standing at your full height; no workout can guarantee growing taller.</p>'
    + (S.plan==='core'? '<p class="small" style="color:var(--ok);font-weight:700">✓ Active plan</p>' : '<button class="btn" id="pickCore">Use this plan</button>') + '</div>';
  h+='<div class="planpick'+(S.plan==='btr'?' active':'')+'"><span class="pill">Beyond the Rim</span><h3>20-week jump program</h3><p class="focus">Beyond the Rim — Bodyweight Edition by Nathanael Morton. Phases 1–5, days in order, with the book\'s demonstration videos. Phase Zero is a 4-week knee-pain prep — include it only if you have knee pain.</p>'
    + '<label class="small" style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="zeroChk" '+(S.btrZero?'checked':'')+' style="width:20px;height:20px;accent-color:var(--acc)"> Include Phase Zero (knee pain)</label>'
    + (S.plan==='btr'? '<p class="small" style="color:var(--ok);font-weight:700">✓ Active plan · '+btrDoneCount()+' of '+btrSeq().length+' days done</p>' : '<button class="btn" id="pickBtr">Use this plan</button>') + '</div>';
  h+='<div class="card"><h3>Core &amp; Posture training days</h3><p class="dim small">Which days of the week the Core &amp; Posture plan schedules workouts.</p><div class="chips">'
    + DAYNAMES.map((n,i)=>'<span class="chip'+(S.coreDays.includes(i)?' on':'')+'" data-dow="'+i+'">'+n+'</span>').join('')+'</div></div>';
  h+='<div class="card"><h3>About this version</h3><p class="dim small">This hosted copy saves your plan, check-offs and progress in this browser on this device only — it does not sync between devices and has no reminders or calendar suggestions. Clearing browser data resets it.</p>'
    + '<button class="btn ghost" id="wipeBtn">Erase all my progress on this device</button></div>';
  view.innerHTML=h;
  const pc=document.getElementById('pickCore'); if(pc) pc.onclick=()=>{ S.plan='core'; save(); render(); };
  const pb=document.getElementById('pickBtr'); if(pb) pb.onclick=()=>{ S.plan='btr'; save(); render(); };
  const z=document.getElementById('zeroChk'); if(z) z.onchange=()=>{ S.btrZero=z.checked; save(); if(S.plan==='btr') render(); };
  view.querySelectorAll('[data-dow]').forEach(c=> c.onclick=()=>{
    const i=parseInt(c.dataset.dow);
    if(S.coreDays.includes(i)) S.coreDays=S.coreDays.filter(x=>x!==i); else S.coreDays.push(i);
    if(!S.coreDays.length) S.coreDays=[i];
    S.coreDays.sort(); save(); render();
  });
  const w=document.getElementById('wipeBtn'); if(w) w.onclick=()=>{
    if(w.dataset.arm){ localStorage.removeItem(LS_KEY); location.reload(); }
    else { w.dataset.arm='1'; w.textContent='Tap again to confirm erase'; }
  };
}


const APP_VERSION='1.5';
(function autoUpdateCheck(){
  try{
    if(new URLSearchParams(location.search).get('u')===APP_VERSION) return;
    fetch('index.html?vc='+Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){
        var m=/name="app-version" content="([0-9.]+)"/.exec(t);
        if(!m) return;
        var nv=m[1];
        var a=APP_VERSION.split('.').map(Number), b=nv.split('.').map(Number);
        var newer=false;
        for(var i=0;i<Math.max(a.length,b.length);i++){ var d=(b[i]||0)-(a[i]||0); if(d>0){ newer=true; break; } if(d<0) break; }
        if(!newer) return;
        if(sessionStorage.getItem('wa_reload_for')===nv) return;
        sessionStorage.setItem('wa_reload_for', nv);
        location.replace(location.pathname+'?u='+nv);
      })
      .catch(function(){});
  }catch(e){}
})();

render();
</script>
